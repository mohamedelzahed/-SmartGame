<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي المتعدد الشامل</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-robot"></i></div>
    <h1>المساعد الذكي المتميز</h1>
    <p>منصة واحدة لإدارة التعليم، التقنية، الصحة، والمهام اليومية</p>
</header>

<div class="container">
    <div class="input-section">
        <input type="text" id="taskInput" placeholder="أدخل (مادة دراسية، تمرين رياضي، مشروع برمي، أو فكرة)...">
        <button onclick="createSmartTask()" class="btn-main">إنشاء وحدة ذكية</button>
        <button onclick="clearAllTasks()" class="btn-danger">مسح الذاكرة</button>
    </div>

    <div id="smartTasksContainer">
        <!-- الوحدات الذكية تظهر هنا -->
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
